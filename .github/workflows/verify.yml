name: Verify Shortlist
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shortlist
          POSTGRES_PASSWORD: shortlist-ci-only
          POSTGRES_DB: shortlist_ci
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U shortlist -d shortlist_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://shortlist:shortlist-ci-only@127.0.0.1:55432/shortlist_ci
      AGENT_ENGINE: ai-sdk:openai
      SHORTLIST_SPONSORED_AI: "false"
      AGENT_MAX_ITERATIONS: "8"
      AGENT_MAX_RUN_INPUT_TOKENS: "50000"
      NODE_OPTIONS: --max-old-space-size=4096
      AUTH_DISABLED: "false"
      AUTH_AUTO_SIGN_IN: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: node scripts/ci-env.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run agent-native:doctor
      - run: npm run migrate:production
      - run: npm test
      - run: npm run build:tour -- --check
      - run: node --check preview/app.js
      - run: npm run build
        env:
          NITRO_PRESET: node-server
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          DEBUG: pw:webserver
      - run: npm run test:tour
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shortlist-verification
          path: |
            package-lock.json
            reports
            playwright-report
            test-results
          retention-days: 7
